[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "018-buildos-auth-service"
version = "0.1.0"
description = "BuildOS authentication service"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "BuildOS Product Team" }
]

dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "PyJWT>=2.10,<3.0",
    "httpx>=0.28,<1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true